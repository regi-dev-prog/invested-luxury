name: Weekly Newsletter

on:
  schedule:
    # Thursday 13:00 UTC (~09:00 ET / 06:00 PT — Thursday morning for a US
    # audience; ~15:00–16:00 Israel). Change the hour to retime the issue.
    - cron: "0 13 * * 4"
  workflow_dispatch:
    inputs:
      autosend:
        description: "Create a draft in Kit, or actually send"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - send

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run newsletter engine
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          NEWSLETTER_BYPASS_TOKEN: ${{ secrets.NEWSLETTER_BYPASS_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: "4b3ap7pf"
          NEXT_PUBLIC_SANITY_DATASET: "production"
          NEXT_PUBLIC_SITE_URL: "https://investedluxury.com"
          # Manual dispatch obeys its "send"/"draft" choice exactly. Scheduled
          # runs send only when the repo variable NEWSLETTER_AUTOSEND is "true".
          # Outputs "true" to send, "" (draft) otherwise — "" is unambiguously falsy.
          NEWSLETTER_AUTOSEND: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.autosend == 'send') && 'true' || (github.event_name == 'schedule' && vars.NEWSLETTER_AUTOSEND == 'true') && 'true' || '' }}
        run: node scripts/newsletter/run.mjs
